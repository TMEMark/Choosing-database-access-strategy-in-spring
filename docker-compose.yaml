version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: music_jpa_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD:
      POSTGRES_DB: music_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: