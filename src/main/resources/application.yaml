spring:
  application:
    name: Chosing-database-access-strategy-in-spring
  datasource:
    url: jdbc:h2:mem:tradedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
    h2:
      console:
        enabled: true
        path: /h2-console
    flyway:
      enabled: true
      baseline-on-migrate: true
      locations: classpath:db/migration